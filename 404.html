<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank canvas — page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1;1,9..144,300..800,0..100,0..1&family=Manrope:wght@400;600;800&display=swap">
  <style>
    :root{--paper:#f5efe4;--ink:#1c1915;--red:#e2492f;--ochre:#f3a712;--blue:#2f4cc0}
    html{overflow-x:clip}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;text-align:center;padding:24px;overflow:hidden}
    .canvas{position:relative;width:min(88vw,420px);aspect-ratio:4/5;margin:0 auto 30px;background:#fbf8f2;box-shadow:0 0 0 12px #1c1915,0 40px 70px -30px rgba(30,18,8,.6);display:grid;place-items:center;transform:rotate(-2deg)}
    .canvas span{font:italic 400 clamp(90px,24vw,150px)/1 Fraunces,Georgia,serif;letter-spacing:-.05em;color:#e9e1d3}
    svg.splat{position:absolute;width:140px;right:-40px;bottom:-30px;animation:pop .8s cubic-bezier(.16,1,.3,1) .3s both}
    @keyframes pop{from{transform:scale(0) rotate(-40deg)}}
    h1{font:italic 400 clamp(38px,6vw,64px)/1 Fraunces,Georgia,serif;letter-spacing:-.03em;margin:0 0 12px}
    p{font-size:18px;color:#4a433b;max-width:460px;margin:0 auto 26px}
    a{display:inline-flex;align-items:center;height:54px;padding:0 28px;border-radius:999px;background:var(--red);color:#fff;font:800 13.5px/1 Manrope,sans-serif;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;margin:4px}
    a.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.6px var(--ink)}
    .hand{font:700 26px Caveat,cursive;color:var(--red);transform:rotate(-3deg);display:block;margin-bottom:6px}
  </style>
</head>
<body>
  <main>
    <div class="canvas"><span>404</span>
      <svg class="splat" viewBox="0 0 200 200"><path fill="#e2492f" d="M100 38c14 0 18-22 30-18s-2 22 8 30 28-6 32 6-18 14-16 28 22 16 16 30-22 2-30 12 2 30-12 32-10-20-26-20-24 18-34 12 4-24-6-32-28 4-30-10 18-12 16-26-20-18-12-30 22 6 30-4-6-28 6-32 14 22 28 22z"/></svg>
    </div>
    <span class="hand">oops — nothing painted here yet</span>
    <h1>This canvas is blank.</h1>
    <p>The page you're looking for may have moved, or the painting found a new home.</p>
    <a href="/">Go home</a><a class="ghost" href="/gallery.html">Visit the gallery</a>
  </main>
</body>
</html>
